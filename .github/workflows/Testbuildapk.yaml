name: Build Android APK (Lerza Player Pro)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual run button from GitHub Actions tab

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Detect, Unzip Archive & Detect Sub-folders
        run: |
          echo "=========================================================="
          echo "Checking if repository contains uploaded ZIP archive..."
          echo "=========================================================="
          
          # Find any .zip archive in root or subdirectories
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP archive: $ZIP_FILE"
            echo "Unzipping archive contents..."
            mkdir -p ./unzipped_temp
            unzip -q -o "$ZIP_FILE" -d ./unzipped_temp
            
            # Check if gradlew is directly in unzipped_temp or inside a sub-folder
            if [ -f "./unzipped_temp/gradlew" ]; then
              echo "Root gradlew found in unzipped folder. Moving all files to root..."
              cp -rn ./unzipped_temp/* .
            else
              SUB_DIR=$(find ./unzipped_temp -mindepth 1 -maxdepth 3 -type f -name "gradlew" -exec dirname {} \; | head -n 1)
              if [ -n "$SUB_DIR" ]; then
                echo "Found project inside subfolder: $SUB_DIR"
                echo "Flattening subfolder files to project root..."
                cp -rn "$SUB_DIR"/* .
              else
                echo "Warning: gradlew not found in extracted zip, keeping extracted structure."
                cp -rn ./unzipped_temp/* .
              fi
            fi
            rm -rf ./unzipped_temp
          else
            echo "No zip archive found. Running directly on committed source files."
          fi

          # Locate gradlew directory if still inside any subfolder
          if [ ! -f "./gradlew" ]; then
            SUB_GRADLEW=$(find . -maxdepth 3 -type f -name "gradlew" | head -n 1)
            if [ -n "$SUB_GRADLEW" ]; then
              DIR=$(dirname "$SUB_GRADLEW")
              echo "Moving into subfolder containing gradlew: $DIR"
              cd "$DIR"
            fi
          fi

          echo "Making gradlew executable..."
          chmod +x ./gradlew
          ls -la

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LerzaPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
